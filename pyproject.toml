[project]
name = "pytorch-issue-crawler"
version = "0.1.0"
description = "Crawl GitHub issues into a local SQLite cache and mine them (e.g. duplicate detection)."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pyarrow>=14",  # Parquet export/import of the issue DB
]

[project.scripts]
dedupe-candidates = "dedupe_candidates:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["crawl", "fetch_issue", "dedupe_candidates", "export_parquet", "restore_db"]
